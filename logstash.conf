# Logstash Configuration for Real-Time Log Analytics Pipeline
# This configuration reads web server logs, parses them using Grok, and outputs structured JSON

input {
  file {
    path => "/path/to/app.log"  # Update this to your actual log file path
    start_position => "beginning"
    sincedb_path => "/dev/null"  # For testing: always read from beginning
    codec => "plain"
    type => "webserver_logs"
  }
}

filter {
  # Parse Apache/Nginx Combined Log Format using Grok
  grok {
    match => { 
      "message" => '%{IPORHOST:client_ip} %{USER:ident} %{USER:auth} \[%{HTTPDATE:timestamp}\] "%{WORD:request_method} %{URIPATHPARAM:request_path} HTTP/%{NUMBER:http_version}" %{NUMBER:status_code:int} %{NUMBER:response_bytes:int} "%{DATA:referrer}" "%{DATA:user_agent}"'
    }
    # Alternative pattern for logs without all fields
    overwrite => [ "message" ]
  }

  # Parse the timestamp into a proper date field
  date {
    match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }

  # Categorize status codes for easier visualization
  if [status_code] {
    if [status_code] >= 200 and [status_code] < 300 {
      mutate { add_field => { "status_category" => "Success" } }
    } else if [status_code] >= 300 and [status_code] < 400 {
      mutate { add_field => { "status_category" => "Redirect" } }
    } else if [status_code] >= 400 and [status_code] < 500 {
      mutate { add_field => { "status_category" => "Client Error" } }
    } else if [status_code] >= 500 {
      mutate { add_field => { "status_category" => "Server Error" } }
    }
  }

  # GeoIP lookup for client IP (requires GeoIP database)
  # Uncomment when GeoIP database is available
  # geoip {
  #   source => "client_ip"
  #   target => "geoip"
  # }

  # Extract browser and OS information from user agent
  useragent {
    source => "user_agent"
    target => "user_agent_parsed"
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "ident", "auth", "host", "path" ]
  }

  # Add custom fields for analytics
  mutate {
    add_field => { "pipeline" => "elk-log-analytics" }
    add_field => { "environment" => "development" }
  }
}

output {
  # Output to console (stdout) - simulates push to Elasticsearch
  stdout {
    codec => rubydebug
  }

  # Uncomment below to send to Elasticsearch
  # elasticsearch {
  #   hosts => ["localhost:9200"]
  #   index => "webserver-logs-%{+YYYY.MM.dd}"
  #   document_type => "_doc"
  # }
}
